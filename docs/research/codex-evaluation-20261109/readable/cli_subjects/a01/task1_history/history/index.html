<p id="p1">At 18:10 the last ferry waited while Mira counted the empty seats.
She wrote, “A late departure can still be a deliberate choice.”</p>
<p id="p2">The next morning, the river was quiet; the timetable guaranteed arrival.
Mira kept the ticket because its small print explained the delay.</p>
