name: One-off DIGR defaults rebuild

on:
  push:
    branches:
      - digr-defaults-build-20260916
  pull_request:
    branches:
      - stable

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: digr-defaults-build-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove one-off workflow before release generation
        run: rm .github/workflows/digr-oneoff-rebuild.yml
      - name: Rebuild and validate release metadata
        run: python tools/build_release.py --output /tmp/digr-release.zip
      - name: Commit generated bundle and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild DIGR execution bundle for canonical defaults"
          git push origin HEAD:digr-defaults-build-20260916
