name: DIGR runtime artifact

on:
  push:
    branches:
      - stable
      - alpha8-convergence-fixes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install 'jsonschema>=4'
      - name: Rebuild release metadata and cold-validate in isolated copy
        run: |
          rm -rf /tmp/digr-release-work
          mkdir -p /tmp/digr-release-work
          tar --exclude=.git -cf - . | tar -xf - -C /tmp/digr-release-work
          cd /tmp/digr-release-work
          python tools/build_release.py --output "/tmp/Deep-Iteration-GPT-Runtime-${GITHUB_SHA}.zip"
      - name: Require committed generated metadata on stable
        if: github.ref_name == 'stable'
        run: |
          cmp -s bundle/EXECUTION_PROTOCOL.json /tmp/digr-release-work/bundle/EXECUTION_PROTOCOL.json || { echo "stable execution bundle drift"; exit 1; }
          cmp -s FILE_TREE.txt /tmp/digr-release-work/FILE_TREE.txt || { echo "stable FILE_TREE drift"; exit 1; }
          cmp -s SHA256SUMS.txt /tmp/digr-release-work/SHA256SUMS.txt || { echo "stable SHA256SUMS drift"; exit 1; }
      - name: Verify stable generated metadata is committed
        if: github.ref_name == 'stable'
        run: |
          cmp bundle/EXECUTION_PROTOCOL.json /tmp/digr-release-work/bundle/EXECUTION_PROTOCOL.json
          cmp FILE_TREE.txt /tmp/digr-release-work/FILE_TREE.txt
          cmp SHA256SUMS.txt /tmp/digr-release-work/SHA256SUMS.txt
      - name: Import validated generated metadata on development branch
        if: github.ref_name == 'alpha8-convergence-fixes'
        run: |
          cp /tmp/digr-release-work/bundle/EXECUTION_PROTOCOL.json bundle/EXECUTION_PROTOCOL.json
          cp /tmp/digr-release-work/FILE_TREE.txt FILE_TREE.txt
          cp /tmp/digr-release-work/SHA256SUMS.txt SHA256SUMS.txt
      - name: Build exact-commit runtime artifact
        run: |
          mkdir -p dist
          python tools/build_runtime_artifact.py \
            --commit-sha "${GITHUB_SHA}" \
            --output "dist/DIGR-RUNTIME-${GITHUB_SHA}.zip"
      - name: Stage generated repository metadata
        run: |
          mkdir -p generated
          cp bundle/EXECUTION_PROTOCOL.json generated/
          cp FILE_TREE.txt generated/
          cp SHA256SUMS.txt generated/
      - name: Publish durable exact-commit runtime release
        if: github.ref_name == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="digr-runtime-${GITHUB_SHA}"
          ASSET="dist/DIGR-RUNTIME-${GITHUB_SHA}.zip"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" "${ASSET}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "DIGR runtime ${GITHUB_SHA}" \
              --notes "Durable exact-commit DIGR runtime transport for ${GITHUB_SHA}. Repository protocol files at the same commit remain semantic authority." \
              --prerelease
          fi
      - name: Commit validated generated metadata on Alpha 8 branch
        if: github.ref_name == 'alpha8-convergence-fixes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundle/EXECUTION_PROTOCOL.json FILE_TREE.txt SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Alpha 8: synchronize validated release metadata"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: digr-runtime-${{ github.sha }}
          path: dist/DIGR-RUNTIME-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload generated release metadata
        uses: actions/upload-artifact@v4
        with:
          name: digr-generated-${{ github.sha }}
          path: generated/
          if-no-files-found: error
          retention-days: 30
