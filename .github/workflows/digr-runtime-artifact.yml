name: DIGR runtime artifact

on:
  push:
    branches:
      - stable
      - alpha6-execution-integrity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install 'jsonschema>=4'
      - name: Rebuild release metadata and cold-validate
        run: |
          python tools/build_release.py --output "/tmp/Deep-Iteration-GPT-Runtime-${GITHUB_SHA}.zip"
      - name: Build exact-commit runtime artifact
        run: |
          mkdir -p dist
          python tools/build_runtime_artifact.py \
            --commit-sha "${GITHUB_SHA}" \
            --output "dist/DIGR-RUNTIME-${GITHUB_SHA}.zip"
      - name: Stage generated repository metadata
        run: |
          mkdir -p generated
          cp bundle/EXECUTION_PROTOCOL.json generated/
          cp FILE_TREE.txt generated/
          cp SHA256SUMS.txt generated/
      - name: Commit validated generated metadata on Alpha 6 branch
        if: github.ref_name == 'alpha6-execution-integrity'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundle/EXECUTION_PROTOCOL.json FILE_TREE.txt SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Alpha 6: synchronize validated release metadata"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: digr-runtime-${{ github.sha }}
          path: dist/DIGR-RUNTIME-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload generated release metadata
        uses: actions/upload-artifact@v4
        with:
          name: digr-generated-${{ github.sha }}
          path: generated/
          if-no-files-found: error
          retention-days: 30
